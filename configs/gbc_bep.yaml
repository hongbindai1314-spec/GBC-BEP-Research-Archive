forecast:
  history_hours: 168
  horizon_hours: 24
granular_ball:
  theta: 0.80
  n_min: 20
  n0: 20
  delta: 0.10
  lambda_reg: 0.001
  epsilon: 0.000001
  alpha: 1.0
  beta: 1.0
  gamma: 0.5
retrieval:
  top_k: 8
  tau: 1.0
  eta: 0.1
  xi: 0.1
